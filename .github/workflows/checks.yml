name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets in new commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  semgrep:
    name: Source rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned Semgrep
        run: python -m pip install semgrep==1.182.1
      - name: Check open-source rules
        run: semgrep scan --config p/default --error --metrics off

  private-content:
    name: Generic privacy patterns
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check new commits' author details without printing them
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          import os
          import re
          import subprocess
          import sys

          def allowed_email(value):
              if '@' not in value:
                  return False
              local, domain = value.rsplit('@', 1)
              domain = domain.lower()
              return domain == 'example.com' or (
                  domain == 'users.noreply.github.com'
                  and re.fullmatch(r'(?:[0-9]+\+)?[A-Za-z0-9-]+', local) is not None
              )

          event = os.environ.get('EVENT_NAME', '')
          if event == 'pull_request':
              span = [f"{os.environ['PR_BASE']}..{os.environ['PR_HEAD']}"]
          elif event == 'push' and not set(os.environ.get('PUSH_BEFORE', '0')) <= {'0'}:
              span = [f"{os.environ['PUSH_BEFORE']}..{os.environ['PUSH_AFTER']}"]
          else:
              span = ['-n', '50', 'HEAD']
          commits = subprocess.check_output(['git', 'rev-list', *span], text=True).split()
          failures = 0
          for sha in commits:
              author, committer, authored, committed = subprocess.check_output(
                  ['git', 'log', '-1', '--format=%ae%n%ce%n%ai%n%ci', sha], text=True
              ).splitlines()[:4]
              kinds = []
              # GitHub's own merge, squash and update commits carry GitHub as
              # committer and the merger's local time; only the author email is
              # the person's choice, so that is all checked for them.
              made_by_github = committer == '@'.join(['noreply', 'github.com'])
              if not allowed_email(author) or (not made_by_github and not allowed_email(committer)):
                  kinds.append('email outside allow-list')
              if not made_by_github and (not authored.endswith('+0000') or not committed.endswith('+0000')):
                  kinds.append('date not in UTC')
              if kinds:
                  print(f'{sha}: {", ".join(kinds)}')
                  failures += 1
          print(f'Commits checked: {len(commits)}; findings: {failures}')
          sys.exit(1 if failures else 0)
      - name: Check tracked files without printing matched values
        shell: python
        run: |
          import ipaddress
          from pathlib import Path
          import re
          import subprocess
          import sys

          home = re.compile(r"/(?:Users|home)/")
          ipv4 = re.compile(r"(?<![\w.])(?:\d{1,3}\.){3}\d{1,3}(?![\w.])")
          ipv6_candidate = re.compile(r"(?<![\w:])[0-9a-fA-F:]*:[0-9a-fA-F:]+(?![\w:])")
          email = re.compile(r"[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+")

          def allowed_email(value):
              local, domain = value.rsplit('@', 1)
              domain = domain.lower()
              return domain == 'example.com' or (
                  domain == 'users.noreply.github.com'
                  and re.fullmatch(r'(?:[0-9]+\+)?[A-Za-z0-9-]+', local) is not None
              )

          def has_ipv6(line):
              for match in ipv6_candidate.finditer(line):
                  try:
                      ipaddress.IPv6Address(match.group())
                  except ValueError:
                      continue
                  return True
              return False

          files = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          failures = 0
          for raw in filter(None, files):
              path = Path(raw.decode())
              try:
                  lines = path.read_text(encoding='utf-8').splitlines()
              except (UnicodeError, OSError):
                  print(f'{path}: unreadable text; manual privacy review required')
                  failures += 1
                  continue
              for number, line in enumerate(lines, 1):
                  kinds = []
                  if home.search(line):
                      kinds.append('absolute home path')
                  if ipv4.search(line) or has_ipv6(line):
                      kinds.append('IP-shaped value')
                  if any(not allowed_email(m.group()) for m in email.finditer(line)):
                      kinds.append('email outside allow-list')
                  if kinds:
                      print(f'{path}:{number}: {", ".join(kinds)}')
                      failures += 1
          print(f'Privacy findings: {failures}')
          sys.exit(1 if failures else 0)

  zizmor:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned zizmor
        run: python -m pip install zizmor==1.31.1
      - name: Check workflows
        run: zizmor --offline .github/workflows/

  branch-flag:
    name: Branch age and size advisory
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Warn on old or large branches
        shell: python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          import json
          import os
          import subprocess
          import time

          try:
              base = os.environ['BASE_SHA']
              head = os.environ['HEAD_SHA']
              ancestor = subprocess.check_output(
                  ['git', 'merge-base', base, head], text=True
              ).strip()
              timestamps = subprocess.check_output(
                  ['git', 'log', '--format=%ct', f'{ancestor}..{head}'], text=True
              ).splitlines()
              age = max(0, time.time() - min(map(int, timestamps))) / 86400 if timestamps else 0
              with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as stream:
                  pull = json.load(stream)['pull_request']
              changed = pull['additions'] + pull['deletions']
              print(f'Oldest branch commit: {age:.1f} days; changed lines: {changed}')
              if age > 7:
                  print('::warning::Branch work is older than 7 days; consider a smaller slice.')
              if changed > 400:
                  print('::warning::Branch changes more than 400 lines; consider splitting it.')
          except (KeyError, ValueError, OSError, subprocess.SubprocessError):
              print('::warning::Branch advisory unavailable; inspect age and size manually.')
